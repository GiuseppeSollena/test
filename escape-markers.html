<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Escape Room AR - Marker Liberi</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
  body { margin: 0; overflow: hidden; background: #000; }
  .overlay {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 14px;
    text-align: center;
    color: #fff;
    background: rgba(0,0,0,0.55);
    z-index: 999;
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
  }

  #lockOverlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  #lockPanel {
    pointer-events: all;
    background: rgba(10,10,30,0.92);
    border: 2px solid #ffcc00;
    border-radius: 16px;
    padding: 20px 28px;
    text-align: center;
    font-family: -apple-system, system-ui, sans-serif;
    color: #fff;
    min-width: 260px;
    box-shadow: 0 0 30px rgba(255,204,0,0.35);
  }
  #lockTitle { font-size: 1.3rem; font-weight: 700; margin-bottom: 18px; color: #ffcc00; }
  #lockDials { display: flex; gap: 12px; justify-content: center; margin-bottom: 18px; }
  .dial { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .dial-btn { background: #333; border: 1px solid #ffcc00; color: #ffcc00; font-size: 1.1rem; width: 38px; height: 32px; border-radius: 6px; cursor: pointer; }
  .dial-digit { font-size: 2rem; font-weight: 800; width: 38px; text-align: center; background: #111; border: 1px solid #555; border-radius: 6px; padding: 2px 0; color: #fff; }
  #unlockBtn { background: #ffcc00; color: #000; border: none; border-radius: 8px; padding: 10px 32px; font-size: 1rem; font-weight: 700; cursor: pointer; }
  #lockMsg { margin-top: 14px; font-size: 1rem; font-weight: 600; min-height: 24px; }

  /* Toast "oggetto preso" */
  #toast {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.4);
    background: rgba(0,200,100,0.95);
    color: #fff;
    padding: 18px 36px;
    border-radius: 60px;
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 1.4rem;
    font-weight: 800;
    z-index: 2000;
    opacity: 0;
    pointer-events: none;
    transition: transform 0.25s cubic-bezier(.34,1.56,.64,1), opacity 0.25s ease;
  }
  #toast.show {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }
  #toast.hide {
    transform: translate(-50%, -50%) scale(0.4);
    opacity: 0;
    transition: transform 0.3s ease, opacity 0.3s ease;
  }

  /* ── Oggetti raccoglibili (stile geo.html) ── */
  .treasure-item {
    display: none;
    position: fixed;
    top: 50%; left: 50%;
    width: clamp(160px, 50vmin, 260px);
    height: clamp(160px, 50vmin, 260px);
    font-size: clamp(100px, 32vmin, 180px);
    align-items: center; justify-content: center;
    animation: float 2s ease-in-out infinite;
    filter: drop-shadow(0 0 24px rgba(100,180,255,0.7));
    z-index: 1001;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    transform: translate(-50%, -50%);
  }
  .treasure-item.active { display: flex; }
  .treasure-item.collecting {
    animation: collect 0.7s ease-out forwards;
    pointer-events: none;
  }
  @keyframes float {
    0%,100% { transform: translate(-50%, -50%) scale(1); }
    50%      { transform: translate(-50%, calc(-50% - 18px)) scale(1); }
  }
  @keyframes collect {
    0%   { transform: translate(-50%, -50%) scale(1);            opacity: 1; }
    40%  { transform: translate(-50%, calc(-50% - 30px)) scale(1.4) rotate(15deg); opacity: 1; }
    100% { transform: translate(-50%, calc(-50% - 80px)) scale(0.2) rotate(35deg); opacity: 0; }
  }
  #astro-sparkle {
    display: none;
    position: fixed;
    top: 50%; left: 50%;
    font-size: 36px;
    transform: translate(-50%, -50%);
    z-index: 1002;
    pointer-events: none;
  }
  #astro-sparkle.show {
    display: block;
    animation: sparkle-burst 0.7s ease-out forwards;
  }
  @keyframes sparkle-burst {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.4); }
    30%  { opacity: 1; transform: translate(-50%, -50%) scale(1.3); }
    100% { opacity: 0; transform: translate(-50%, calc(-50% - 40px)) scale(2); }
  }
</style>
</head>
<body>

<div class="overlay">📷 Inquadra un qualsiasi marker in casa</div>
<div id="toast"></div>
<div id="vigile-treasure"   class="treasure-item">👮</div>
<div id="semaforo-treasure" class="treasure-item">🚦</div>
<div id="stop-treasure"     class="treasure-item">🛑</div>
<div id="sparkle">✨</div>

<!-- UI Lucchetto (Compare SOLO quando si inquadra il Marker 0) -->
<div id="lockOverlay">
  <div id="lockPanel">
    <div id="lockTitle">🔒 LUCCHETTO</div>
    <div id="lockDials">
      <div class="dial"><button class="dial-btn" onclick="changeDial(0,1)">▲</button><span class="dial-digit" id="d0">0</span><button class="dial-btn" onclick="changeDial(0,-1)">▼</button></div>
      <div class="dial"><button class="dial-btn" onclick="changeDial(1,1)">▲</button><span class="dial-digit" id="d1">0</span><button class="dial-btn" onclick="changeDial(1,-1)">▼</button></div>
      <div class="dial"><button class="dial-btn" onclick="changeDial(2,1)">▲</button><span class="dial-digit" id="d2">0</span><button class="dial-btn" onclick="changeDial(2,-1)">▼</button></div>
      <div class="dial"><button class="dial-btn" onclick="changeDial(3,1)">▲</button><span class="dial-digit" id="d3">0</span><button class="dial-btn" onclick="changeDial(3,-1)">▼</button></div>
    </div>
    <button id="unlockBtn" onclick="tryUnlock()">SBLOCCA</button>
    <div id="lockMsg"></div>
  </div>
</div>

<a-scene
  mindar-image="imageTargetSrc: targets.mind; autoStart: true; uiScanning: yes; uiLoading: yes; filterMinCF: 0.001; filterBeta: 0.01;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>
  <a-assets>
  </a-assets>

  <!-- Telecamera: Aggiungiamo direttamente il raycaster alla camera per massima precisione -->
  <a-camera position="0 0 0" look-controls="enabled: false">
  </a-camera>

  <!-- MARKER INDEX 0 -> LUCCHETTO (solo rilevamento, UI in overlay HTML) -->
  <a-entity mindar-image-target="targetIndex: 0" id="lockMarker">
  </a-entity>

  <!-- MARKER INDEX 1 -> VIGILE -->
  <a-entity mindar-image-target="targetIndex: 1" id="vigileMarker"></a-entity>

  <!-- MARKER INDEX 2 -> SEMAFORO -->
  <a-entity mindar-image-target="targetIndex: 2" id="semaforoMarker"></a-entity>

  <!-- MARKER INDEX 3 -> STOP -->
  <a-entity mindar-image-target="targetIndex: 3" id="stopMarker"></a-entity>

</a-scene>

<script>
  // --- LOGICA LUCCHETTO (MARKER 0) ---
  const digits = [0, 0, 0, 0];
  const COMBO  = [8, 8, 8, 8];

  function changeDial(i, delta) {
    digits[i] = (digits[i] + delta + 10) % 10;
    document.getElementById('d' + i).textContent = digits[i];
    document.getElementById('lockMsg').textContent = '';
  }

  function tryUnlock() {
    const ok = digits.every((d, i) => d === COMBO[i]);
    const msg = document.getElementById('lockMsg');
    const btn = document.getElementById('unlockBtn');
    
    if (ok) {
      msg.textContent = '✅ SBLOCCATO!';
      msg.style.color = '#00ff88';
      btn.disabled = true;
      btn.style.opacity = '0.5';
    } else {
      msg.textContent = '❌ Combinazione errata';
      msg.style.color = '#ff4444';
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    // 1. Gestione visibilità pannello HTML SOLO per Marker 0 (Lucchetto)
    const lockMarker = document.getElementById('lockMarker');
    lockMarker.addEventListener('targetFound', () => {
      document.getElementById('lockOverlay').style.display = 'flex';
    });
    lockMarker.addEventListener('targetLost', () => {
      document.getElementById('lockOverlay').style.display = 'none';
    });

    // 2. Oggetti raccoglibili (marker 1, 2, 3)
    const collectibles = [
      { markerId: 'vigileMarker',   elemId: 'vigile-treasure',   toast: '👮 Vigile trovato!' },
      { markerId: 'semaforoMarker', elemId: 'semaforo-treasure', toast: '🚦 Semaforo trovato!' },
      { markerId: 'stopMarker',     elemId: 'stop-treasure',     toast: '🛑 Segnale STOP trovato!' },
    ];

    const sparkle = document.getElementById('sparkle');

    collectibles.forEach(({ markerId, elemId, toast }) => {
      let preso = false;
      const treasure = document.getElementById(elemId);
      const marker   = document.getElementById(markerId);

      marker.addEventListener('targetFound', () => {
        if (!preso) treasure.classList.add('active');
      });
      marker.addEventListener('targetLost', () => {
        treasure.classList.remove('active');
      });

      function onCollect(e) {
        if (e && e.type === 'touchstart') e.preventDefault();
        if (preso) return;
        preso = true;

        treasure.classList.add('collecting');
        sparkle.classList.remove('show');
        void sparkle.offsetWidth;
        sparkle.classList.add('show');

        setTimeout(() => {
          treasure.classList.remove('active', 'collecting');
          sparkle.classList.remove('show');

          const toastEl = document.getElementById('toast');
          toastEl.textContent = toast;
          toastEl.classList.remove('hide');
          toastEl.classList.add('show');
          setTimeout(() => { toastEl.classList.remove('show'); toastEl.classList.add('hide'); }, 2000);
        }, 750);
      }

      treasure.addEventListener('click', onCollect);
      treasure.addEventListener('touchstart', onCollect, { passive: false });
    });
  });
</script>
</body>
</html>
