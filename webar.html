<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>AR Oggetto sul Divano</title>

<!-- model-viewer: componente web ufficiale di Google, gestisce sia iOS che Android -->
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>
  :root {
    --brand: #1b6f8c;
    --accent: #f2c94c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, system-ui, sans-serif;
    background: #0d2b36;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 20px;
    text-align: center;
  }
  header h1 {
    margin: 0 0 4px;
    font-size: 1.2rem;
  }
  header p {
    margin: 0;
    font-size: 0.85rem;
    opacity: 0.75;
  }

  model-viewer {
    flex: 1;
    width: 100%;
    min-height: 60vh;
    --poster-color: transparent;
    background-color: #0d2b36;
  }

  /* Bottone AR custom (sostituisce lo slot ar-button di default) */
  #ar-button {
    background: var(--accent);
    color: #1a1a1a;
    border: none;
    border-radius: 999px;
    padding: 14px 28px;
    font-size: 1rem;
    font-weight: 600;
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
  }

  #ar-button:active { transform: translateX(-50%) scale(0.97); }

  #ar-unsupported {
    display: none;
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.6);
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 0.8rem;
    max-width: 80%;
    text-align: center;
  }

  footer {
    text-align: center;
    padding: 10px;
    font-size: 0.7rem;
    opacity: 0.5;
  }
</style>
</head>
<body>

<header>
  <h1>🛋️ Guarda l'oggetto sopra il tuo divano</h1>
  <p>Tocca "Vedi in AR" e inquadra lo spazio con la camera</p>
</header>

<model-viewer
  id="viewer"
  src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
  ios-src="https://modelviewer.dev/shared-assets/models/Astronaut.usdz"
  alt="Oggetto 3D di esempio"
  ar
  ar-modes="webxr scene-viewer quick-look"
  ar-scale="auto"
  ar-placement="wall"
  camera-controls
  auto-rotate
  shadow-intensity="1"
  exposure="1"
  environment-image="neutral"
  poster=""
  loading="eager"
  reveal="auto"
>
  <button slot="ar-button" id="ar-button">🔮 Vedi in AR</button>
  <div id="ar-unsupported" slot="ar-button" style="display:none;">
    AR non supportata su questo browser. Prova con Chrome (Android) o Safari (iOS).
  </div>
</model-viewer>

<footer>
  demo — sostituisci src/ios-src con il tuo modello
</footer>

<script>
  const viewer = document.getElementById('viewer');

  // Mostra un messaggio se il device non supporta nessuna modalità AR
  viewer.addEventListener('ar-status', (e) => {
    console.log('ar-status:', e.detail.status);
  });

  document.querySelector('body').addEventListener('DOMContentLoaded', () => {});

  window.addEventListener('load', () => {
    if (!viewer.canActivateAR) {
      document.getElementById('ar-button').style.display = 'none';
      document.getElementById('ar-unsupported').style.display = 'block';
    }
  });
</script>

</body>
</html>
