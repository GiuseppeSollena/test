<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Escape Room AR - Marker Liberi</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
  body { margin: 0; overflow: hidden; background: #000; }
  .overlay {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 14px;
    text-align: center;
    color: #fff;
    background: rgba(0,0,0,0.55);
    z-index: 999;
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
  }

  #lockOverlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  #lockPanel {
    pointer-events: all;
    background: rgba(10,10,30,0.92);
    border: 2px solid #ffcc00;
    border-radius: 16px;
    padding: 20px 28px;
    text-align: center;
    font-family: -apple-system, system-ui, sans-serif;
    color: #fff;
    min-width: 260px;
    box-shadow: 0 0 30px rgba(255,204,0,0.35);
  }
  #lockTitle { font-size: 1.3rem; font-weight: 700; margin-bottom: 18px; color: #ffcc00; }
  #lockDials { display: flex; gap: 12px; justify-content: center; margin-bottom: 18px; }
  .dial { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .dial-btn { background: #333; border: 1px solid #ffcc00; color: #ffcc00; font-size: 1.1rem; width: 38px; height: 32px; border-radius: 6px; cursor: pointer; }
  .dial-digit { font-size: 2rem; font-weight: 800; width: 38px; text-align: center; background: #111; border: 1px solid #555; border-radius: 6px; padding: 2px 0; color: #fff; }
  #unlockBtn { background: #ffcc00; color: #000; border: none; border-radius: 8px; padding: 10px 32px; font-size: 1rem; font-weight: 700; cursor: pointer; }
  #lockMsg { margin-top: 14px; font-size: 1rem; font-weight: 600; min-height: 24px; }

  /* Toast "oggetto preso" */
  #toast {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.4);
    background: rgba(0,200,100,0.95);
    color: #fff;
    padding: 18px 36px;
    border-radius: 60px;
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 1.4rem;
    font-weight: 800;
    z-index: 2000;
    opacity: 0;
    pointer-events: none;
    transition: transform 0.25s cubic-bezier(.34,1.56,.64,1), opacity 0.25s ease;
  }
  #toast.show {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }
  #toast.hide {
    transform: translate(-50%, -50%) scale(0.4);
    opacity: 0;
    transition: transform 0.3s ease, opacity 0.3s ease;
  }

  /* Pulsante "Prendi" astronauta */
  #pickupOverlay {
    display: none;
    position: fixed;
    bottom: 48px; left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
  }
  #pickupBtn {
    background: rgba(20,20,60,0.92);
    border: 2px solid #7eb8ff;
    color: #fff;
    border-radius: 50px;
    padding: 14px 36px;
    font-size: 1.1rem;
    font-weight: 700;
    font-family: -apple-system, system-ui, sans-serif;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    animation: pulse 1.4s ease-in-out infinite;
  }
  #pickupBtn:active { opacity: 0.7; }
  #pickupBtn:disabled { opacity: 0.4; animation: none; cursor: default; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(126,184,255,0.5); }
    50%       { box-shadow: 0 0 0 10px rgba(126,184,255,0); }
  }
</style>
</head>
<body>

<div class="overlay">📷 Inquadra un qualsiasi marker in casa</div>
<div id="toast"></div>
<div id="pickupOverlay"><button id="pickupBtn">👨‍🚀 PRENDI</button></div>

<!-- UI Lucchetto (Compare SOLO quando si inquadra il Marker 0) -->
<div id="lockOverlay">
  <div id="lockPanel">
    <div id="lockTitle">🔒 LUCCHETTO</div>
    <div id="lockDials">
      <div class="dial"><button class="dial-btn" onclick="changeDial(0,1)">▲</button><span class="dial-digit" id="d0">0</span><button class="dial-btn" onclick="changeDial(0,-1)">▼</button></div>
      <div class="dial"><button class="dial-btn" onclick="changeDial(1,1)">▲</button><span class="dial-digit" id="d1">0</span><button class="dial-btn" onclick="changeDial(1,-1)">▼</button></div>
      <div class="dial"><button class="dial-btn" onclick="changeDial(2,1)">▲</button><span class="dial-digit" id="d2">0</span><button class="dial-btn" onclick="changeDial(2,-1)">▼</button></div>
      <div class="dial"><button class="dial-btn" onclick="changeDial(3,1)">▲</button><span class="dial-digit" id="d3">0</span><button class="dial-btn" onclick="changeDial(3,-1)">▼</button></div>
    </div>
    <button id="unlockBtn" onclick="tryUnlock()">SBLOCCA</button>
    <div id="lockMsg"></div>
  </div>
</div>

<a-scene
  mindar-image="imageTargetSrc: targets.mind; autoStart: true; uiScanning: yes; uiLoading: yes; filterMinCF: 0.001; filterBeta: 0.01;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>
  <a-assets>
    <a-asset-item id="astronautModel" src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"></a-asset-item>
  </a-assets>

  <!-- Telecamera: Aggiungiamo direttamente il raycaster alla camera per massima precisione -->
  <a-camera position="0 0 0" look-controls="enabled: false">
  </a-camera>

  <!-- MARKER INDEX 0 -> LUCCHETTO 3D -->
  <a-entity mindar-image-target="targetIndex: 0" id="lockMarker">
    <a-box position="0 -0.04 0" width="0.18" height="0.14" depth="0.06" color="#1a1a2e" roughness="0.3" metalness="0.9"></a-box>
    <a-box position="0 -0.04 0.031" width="0.16" height="0.04" depth="0.002" color="#ffcc00" roughness="0.2" metalness="1"></a-box>
    <a-torus id="shackle" position="0 0.055 0" radius="0.055" radius-tubular="0.01" arc="180" color="#aaaaaa" roughness="0.2" metalness="1"></a-torus>
    <a-cylinder position="0 -0.04 0.034" radius="0.014" height="0.005" color="#000"></a-cylinder>
    <a-box position="0 -0.055 0.034" width="0.007" height="0.018" depth="0.005" color="#000"></a-box>
  </a-entity>

  <!-- MARKER INDEX 1 -> ASTRONAUTA CLICCABILE -->
  <a-entity mindar-image-target="targetIndex: 1" id="astroMarker">
    <!-- Modello Visivo 3D -->
    <a-gltf-model
      id="astronauta"
      src="#astronautModel"
      position="0 0 0.1"
      rotation="0 0 0"
      scale="0.7 0.7 0.7">
    </a-gltf-model>

    <!-- Box Cliccabile Invisibile attorno all'astronauta per catturare SEMPRE il tap/click -->
    <a-box
      id="astroHitbox"
      class="cliccabile"
      position="0 0.2 0.1"
      width="0.5" height="0.8" depth="0.5"
      material="opacity: 0.0; transparent: true">
    </a-box>
  </a-entity>

</a-scene>

<script>
  // --- LOGICA LUCCHETTO (MARKER 0) ---
  const digits = [0, 0, 0, 0];
  const COMBO  = [8, 8, 8, 8];

  function changeDial(i, delta) {
    digits[i] = (digits[i] + delta + 10) % 10;
    document.getElementById('d' + i).textContent = digits[i];
    document.getElementById('lockMsg').textContent = '';
  }

  function tryUnlock() {
    const ok = digits.every((d, i) => d === COMBO[i]);
    const msg = document.getElementById('lockMsg');
    const btn = document.getElementById('unlockBtn');
    
    if (ok) {
      msg.textContent = '✅ SBLOCCATO!';
      msg.style.color = '#00ff88';
      btn.disabled = true;
      btn.style.opacity = '0.5';
      
      const shackle = document.querySelector('#shackle');
      if (shackle) shackle.setAttribute('position', '0 0.11 0');
    } else {
      msg.textContent = '❌ Combinazione errata';
      msg.style.color = '#ff4444';
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    // 1. Gestione visibilità pannello HTML SOLO per Marker 0 (Lucchetto)
    const lockMarker = document.getElementById('lockMarker');
    lockMarker.addEventListener('targetFound', () => {
      document.getElementById('lockOverlay').style.display = 'flex';
    });
    lockMarker.addEventListener('targetLost', () => {
      document.getElementById('lockOverlay').style.display = 'none';
    });

    // 2. Pulsante HTML per raccogliere l'astronauta (touch-safe)
    let astroPreso = false;
    const astroMarker = document.getElementById('astroMarker');
    astroMarker.addEventListener('targetFound', () => {
      if (!astroPreso) document.getElementById('pickupOverlay').style.display = 'block';
    });
    astroMarker.addEventListener('targetLost', () => {
      document.getElementById('pickupOverlay').style.display = 'none';
    });

    let lastPickup = 0;
    function raccogliAstronauta(e) {
      if (e.type === 'touchstart') e.preventDefault();
      const now = Date.now();
      if (now - lastPickup < 300) return;
      lastPickup = now;
      if (astroPreso) return;
      astroPreso = true;
      document.getElementById('pickupOverlay').style.display = 'none';

      const astro = document.getElementById('astronauta');

      // Spin + scale-up
      astro.setAttribute('animation__spin', {
        property: 'rotation', to: '0 360 20',
        dur: 350, easing: 'easeInQuad'
      });
      astro.setAttribute('animation__up', {
        property: 'scale', to: '1.0 1.0 1.0',
        dur: 200, easing: 'easeOutBack'
      });

      // Poi scompare verso l'alto
      setTimeout(() => {
        astro.setAttribute('animation__vanish', {
          property: 'scale', to: '0 0 0',
          dur: 300, easing: 'easeInQuad'
        });
        astro.setAttribute('animation__rise', {
          property: 'position', to: '0 0.4 0.1',
          dur: 300, easing: 'easeInQuad'
        });
      }, 220);

      // Toast visivo
      const toast = document.getElementById('toast');
      toast.textContent = '👨‍🚀 Oggetto preso!';
      toast.classList.remove('hide');
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
        toast.classList.add('hide');
      }, 2000);
    }

    const btn = document.getElementById('pickupBtn');
    btn.addEventListener('click', raccogliAstronauta);
    btn.addEventListener('touchstart', raccogliAstronauta, { passive: false });
  });
</script>
</body>
</html>
