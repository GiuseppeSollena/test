<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gatto in WebAR</title>

  <!-- Importa la libreria Model Viewer di Google -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background-color: #f0f0f0;
    }

    .ar-button {
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 12px 24px;
      font-weight: bold;
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 16px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }
  </style>
</head>

<body>

  <!-- Componente AR -->
  <model-viewer src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Fox/glTF-Binary/Fox.glb"
    ios-src="https://developer.apple.com/augmented-reality/quick-look/models/fox/fox.usdz" ar
    ar-modes="quick-look scene-viewer webxr" camera-controls>
  </model-viewer>

</body>

</html>
