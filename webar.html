<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gatto in WebAR</title>
  
  <!-- Importa la libreria Model Viewer di Google -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      background-color: #f0f0f0;
    }
    .ar-button {
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 12px 24px;
      font-weight: bold;
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <!-- Componente AR -->
  <model-viewer 
    src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Fox/glTF-Binary/Fox.glb" 
    alt="Un modello 3D in Realtà Aumentata" 
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    auto-rotate
    shadow-intensity="1">
    
    <button slot="ar-button" class="ar-button">
      🐱 Vedi il gatto nella tua stanza
    </button>
    
  </model-viewer>

</body>
</html>
